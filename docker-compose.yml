# Dockhand Git-Stack: Repository wird von Dockhand ausgecheckt.
services:
  blf-asterisk:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/yealink-blf-asterisk:multitenant-1
    pull_policy: build
    container_name: blf-asterisk
    restart: unless-stopped
    network_mode: host
    init: true
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD_fehlt}"
      SIP_HOST: "${SIP_HOST:?SIP_HOST_fehlt}"
      SIP_PORT: "${SIP_PORT:-5062}"
      SIP_PUBLIC_IP: "${SIP_PUBLIC_IP:-}"
      SIP_LOCAL_NET: "${SIP_LOCAL_NET:-}"
      API_BIND_IP: "${API_BIND_IP:-127.0.0.1}"
      API_PORT: "${API_PORT:-8787}"
      SIP_PASSWORD: "${SIP_PASSWORD:-}"
      API_TOKEN: "${API_TOKEN:-}"
    volumes:
      - asterisk-state:/var/lib/asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
volumes:
  asterisk-state:
