; Minimaler Dialplan zum BLF-Test (kein Telefoniestatus ueber Calls).
; Die Nebenstelle 9001 wird als Presence-Ressource abonniert.

[general]
static=yes
writeprotect=no

[presence-test]
; 0 = NOT_INUSE, 1 = BUSY (wird per Asterisk CLI geaendert).
exten => 9001,hint,Custom:spontan

; Anrufe sollen nicht vermittelt werden.
exten => 9001,1,Hangup()
exten => _X.,1,Hangup()
